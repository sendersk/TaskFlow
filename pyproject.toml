
[project]
name = "taskflow"
version = "0.1.0"
description = "A task and workflow management system built with Python and FastAPI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true
